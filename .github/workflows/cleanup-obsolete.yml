name: Limpiar motores obsoletos

on:
  workflow_dispatch:

concurrency:
  group: max-min-maintenance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python tools/cleanup_obsolete.py --apply --report audit/cleanup_report.json
      - run: python tools/audit_data_integrity.py --report audit/data_integrity_report.json
      - run: python tools/audit_project.py
      - run: |
          if git diff --quiet; then
            echo "Sin archivos obsoletos"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: retirar motores obsoletos"
            git push
          fi
