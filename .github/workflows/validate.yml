name: Validar Max Min Remaster

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install openpyxl pypdf Pillow
      - run: node --check js/app.js
      - run: node --check sw.js
      - run: node tools/audit_business_rules.cjs
      - run: python tools/cleanup_obsolete.py --report /tmp/cleanup_report.json
      - run: python tools/audit_data_integrity.py --report /tmp/data_integrity_report.json
      - run: python tools/audit_project.py
      - run: python tools/audit_experience.py --pdf-output /tmp/Lista_MIN_MAX_Muestra.pdf --report /tmp/experience_report.json
      - run: python tools/prepare_pdf_release.py --output /tmp/Etiquetas_MIN_MAX_Muestra.pdf --report /tmp/pdf_release_report.json
