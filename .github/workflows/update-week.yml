name: Actualizar semana Max Min

on:
  push:
    branches: [main]
    paths:
      - "updates/incoming/**"
      - "tools/**.py"
      - "tools/tests/**"
      - "sources/Directorio.xlsx"
      - "sources/Lista_Precios_Base.xlsx"
      - ".github/workflows/update-week.yml"
  workflow_dispatch:
    inputs:
      week:
        description: "Semana opcional: debe coincidir con el contenido del source_path"
        required: false
        type: string
      source_path:
        description: "Vacío = procesar TODOS los CSV/ZIP pendientes por su semana real"
        required: false
        type: string

concurrency:
  group: max-min-data-main
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install openpyxl
      - name: Probar cola, duplicados, semanas faltantes y recuperación
        run: python -B -m unittest discover -s tools/tests -v
      - name: Validar y publicar todas las cargas, sin sobrescribir cargas nuevas
        env:
          INPUT_WEEK: ${{ inputs.week }}
          INPUT_SOURCE: ${{ inputs.source_path }}
        run: >-
          python -B tools/process_week_queue.py --push
          --input "$INPUT_SOURCE" --week "$INPUT_WEEK"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Preparar exactamente el sitio validado
        run: python -B tools/build_public_site.py --output "$RUNNER_TEMP/maxmin-public"
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Guardar artefacto validado
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/maxmin-public
      - name: Confirmar vigencia antes de desplegar
        id: vigente
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Llegaron cargas nuevas; la ejecución pendiente validará y publicará el conjunto actualizado." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publicar el sitio verificado
        id: deployment
        if: steps.vigente.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
      - name: Conservar diagnóstico si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maxmin-carga-${{ github.run_id }}
          path: audit/week_queue_failure.json
          if-no-files-found: ignore
          retention-days: 7
